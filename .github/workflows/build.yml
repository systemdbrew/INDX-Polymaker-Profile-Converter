name: Build and release Polymaker profiles

on:
  pull_request:
    paths:
      - "source/**"
      - "convert.py"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "source/**"
      - "convert.py"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Locate Polymaker source archive
        id: source
        shell: bash
        run: |
          mapfile -t archives < <(find source -maxdepth 1 -type f -iname '*.zip' | sort)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one ZIP archive in source/, found ${#archives[@]}." >&2
            exit 1
          fi
          echo "archive=${archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Convert Polymaker profiles
        run: python convert.py "${{ steps.source.outputs.archive }}"

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp output/bundle/INDX-Filament-Profiles-HF0.4-config-bundle.ini \
            release-assets/Polymaker-COREONE-INDX-HF0.4-config-bundle.ini
          cp output/release/INDX-Filament-Profiles-HF0.4.zip \
            release-assets/Polymaker-COREONE-INDX-HF0.4.zip
          cd release-assets
          sha256sum \
            Polymaker-COREONE-INDX-HF0.4-config-bundle.ini \
            Polymaker-COREONE-INDX-HF0.4.zip \
            > SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Polymaker-COREONE-INDX-HF0.4
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

      - name: Detect unreleased source changes on main
        id: source_change
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          latest_source_commit="$(git log -1 --format=%H -- source/)"
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"

          echo "Latest source commit: $latest_source_commit"
          echo "Latest version tag: ${latest_tag:-none}"

          if [[ -z "$latest_source_commit" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "$latest_tag" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$latest_source_commit" "$latest_tag"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create automatic patch release
        if: steps.source_change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [[ -z "$latest_tag" ]]; then
            new_tag="v1.0.0"
          elif [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            new_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            echo "Latest version tag '$latest_tag' is not valid semver." >&2
            exit 1
          fi

          echo "Creating automatic release $new_tag"
          git tag "$new_tag" "${{ github.sha }}"
          git push origin "$new_tag"

          gh release create "$new_tag" \
            release-assets/Polymaker-COREONE-INDX-HF0.4-config-bundle.ini \
            release-assets/Polymaker-COREONE-INDX-HF0.4.zip \
            release-assets/SHA256SUMS.txt \
            --title "INDX Polymaker Profiles $new_tag" \
            --generate-notes \
            --verify-tag

      - name: Create GitHub Release for manual tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; skipping."
            exit 0
          fi
          gh release create "${{ github.ref_name }}" \
            release-assets/Polymaker-COREONE-INDX-HF0.4-config-bundle.ini \
            release-assets/Polymaker-COREONE-INDX-HF0.4.zip \
            release-assets/SHA256SUMS.txt \
            --title "INDX Polymaker Profiles ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
